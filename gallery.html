<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | STS Barber Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .gallery__grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .gallery__item {
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
            box-shadow: var(--card-shadow);
        }
        .gallery__item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.5s ease;
            display: block;
        }
        .gallery__item:hover img {
            transform: scale(1.1);
        }
        .gallery__overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, rgba(15, 23, 42, 0.9));
            padding: 1rem;
            color: #fff;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body class="light-theme">
    <header class="header scroll-header" id="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo">
                <h2>STS <span>Barber Studio</span></h2>
            </a>

            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list">
                    <li class="nav__item"><a href="index.html" class="nav__link">Home</a></li>
                    <li class="nav__item"><a href="about.html" class="nav__link">About Us</a></li>
                    <li class="nav__item"><a href="barbers.html" class="nav__link">Our Barbers</a></li>
                    <li class="nav__item"><a href="services.html" class="nav__link">Services</a></li>
                    <li class="nav__item"><a href="gallery.html" class="nav__link active-link">Gallery</a></li>
                    <li class="nav__item"><a href="contact.html" class="nav__link">Contact</a></li>
                </ul>
            </div>

            <div class="nav__btns">
                <a href="index.html#appointment" class="btn btn-primary nav__btn">Book Now</a>
                <div class="nav__toggle" id="nav-toggle">
                    <i class="fas fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <main class="main" style="padding-top: 6rem;">
        <section class="section container fade-up">
            <h1 class="section__title">Gallery</h1>
            <span class="section__subtitle">Explore our shop and styles</span>
            
            <div class="gallery__grid">
                <div class="gallery__item">
                    <img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Haircut">
                    <div class="gallery__overlay">Premium Haircuts</div>
                </div>
                <div class="gallery__item">
                    <img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Shop Interior">
                    <div class="gallery__overlay">Modern Shop Interior</div>
                </div>
                <div class="gallery__item">
                    <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Beard Trim">
                    <div class="gallery__overlay">Precision Beard Trims</div>
                </div>
                <div class="gallery__item">
                    <img src="https://images.unsplash.com/photo-1622286342621-4bd786c2447c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Premium Equipment">
                    <div class="gallery__overlay">High-End Equipment</div>
                </div>
                <div class="gallery__item">
                    <img src="https://images.unsplash.com/photo-1605497788044-5a32c7078486?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Products">
                    <div class="gallery__overlay">Luxury Styling Products</div>
                </div>
                <div class="gallery__item">
                    <img src="https://images.unsplash.com/photo-1600948836101-f9ffda59d250?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Customers">
                    <div class="gallery__overlay">Happy Customers</div>
                </div>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
